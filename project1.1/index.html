<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/project1.1/style.css">
</head>

<body>
    <main>
        <div class="left-container">
            <img src="../bg.jpg" alt="background">
            <img src="../logo.svg" alt="logo" id="logo">
        </div>
        <div class="right-container">
            <div class="introdruction">
                <h1>Get iintoo it today</h1>
                <p> There is no charge or obligation upon registration</p>
                <div class="buttons">
                    <button class="fb"><img src="../facebook.svg" height="15px"> Register with Facebook</button>
                
                    <button class="linked"><img src="../linkedin.svg" height="13px">Register with LinkedIn</button>
                </div>

                <div class="line-container">
                    <div class="line1"></div>
                    <div class="or">OR</div>
                    <div class="line2"></div>
                 </div>
                
                
        
                <div class="emailphone">
                    <div class="emailcontainer">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email">
                    </div>
                    <div class="phonecontainer">
                        <label for="phone">Phone</label>
                        <input type="tel" name="phone" id="phone">
                    </div>
                </div>

                <div class="question">
                    <h2> What type of investor are you?</h2>
                    <p> Select the type of investor you are below.</p>
                </div>

            
         <div class="select">
                <div class="option-1">
                    <input type="radio" name="choice" id="Individual" checked>
                    <label for="Individual">Individual</label>
                    <span title="I am a natural person investing on my own behalf as a sole owner, 
                    joint tenant, or tenant in common.">&#9432;</span>
                </div>

                <div class="option-2">
                    <input type="radio" name="choice" id="business">
                    <label for="business">Business</label>
                    <span title="I am super-duper businessman.">&#9432;</span>
                </div>

                <div class="option-3">
                    <input type="radio" name="choice" id="ira">
                    <label for="ira">IRA</label>
                    <span title="Just a random Russian name.">&#9432;</span>
                </div>

                <div class="option-4">
                    <input type="radio" name="choice" id="trust">
                    <label for="trust">Trust</label>
                    <span title="Trust me, bro.">&#9432;</span>
                </div>
         </div>

                <div class="terms">
                    <input type="checkbox" id="checkbox" required> 
                    
                    <div class="new">
                    <label for="checkbox"> I agree to the terms and receiving notifications from iintoo.</label>
                    
                    <div class="link"><a href="https://www.lawinsider.com/clause/full-terms-and-conditions" target="_blank">View full
                        terms</a></div></div>
                </div>

                <div class="acc">
                    <button>Create Account</button>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
